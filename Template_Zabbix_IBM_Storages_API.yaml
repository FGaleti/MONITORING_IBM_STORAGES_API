                        var rawValue = vdisk.capacity.trim().toUpperCase();
                        var match = rawValue.match(/([0-9.]+)\s*(KB|MB|GB|TB|PB)/);
            
                        if (match) {
                            var num = parseFloat(match[1]);
                            var unit = match[2];
                            var bytes = num;
            
                            if (unit === 'KB') { bytes = num * 1024; }
                            else if (unit === 'MB') { bytes = num * 1048576; }
                            else if (unit === 'GB') { bytes = num * 1073741824; }
                            else if (unit === 'TB') { bytes = num * 1099511627776; }
                            else if (unit === 'PB') { bytes = num * 1125899906842624; }
            
                            // Cria uma nova chave no JSON com o valor numérico puro
                            vdisk.capacity_bytes = parseFloat(bytes.toFixed(2));
                        } else {
                            // Fallback caso a API mande um número puro sem letras
                            var parsedNum = parseFloat(rawValue);
                            if (!isNaN(parsedNum)) {
                                vdisk.capacity_bytes = parsedNum;
                            }
                        }
                    }
                }
            
                return JSON.stringify(dataParsed);
            
            } catch (e) {
