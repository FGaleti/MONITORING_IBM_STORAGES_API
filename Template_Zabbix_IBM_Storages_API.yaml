                        nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
            -
              uuid: 0af751edf4794819a68c9a63ca5a60e9
              name: 'Tipo do Enclosure: "{#ENCLOSURE_ID}" (SN: "{#SERIAL_NUMBER}")'
              type: DEPENDENT
              key: 'enclosure.type["{#ENCLOSURE_ID}"]'
              delay: '0'
              history: 31d
              trends: '0'
              discover: NO_DISCOVER
              value_type: CHAR
              preprocessing:
                -
                  type: JSONPATH
                  parameters:
                    - '$..[?(@.id == "{#ENCLOSURE_ID}")].type.first()'
              master_item:
                key: Get.LsEnclosure
          trigger_prototypes:
            -
              uuid: ff554ab6557e4fd5a35cf1dc0dd4eecf
              expression: 'max(/TEMPLATE API STORAGE FS/enclosure.fans.online["{#ENCLOSURE_ID}"],#3)<max(/TEMPLATE API STORAGE FS/enclosure.fans.total["{#ENCLOSURE_ID}"],#3)'
              name: 'Storage: Falha de Refrigeração (Fan Offline no Enclosure "{#ENCLOSURE_ID}")'
              priority: HIGH
              description: |
                Significado: Um ou mais módulos de ventilação (Fan) do Enclosure do storage pararam de funcionar ou estão operando abaixo da rotação mínima exigida.
                Impacto: O equipamento perdeu sua capacidade ideal de refrigeração. O impacto imediato é o aumento rápido da temperatura interna da gaveta. Se a temperatura atingir limites críticos, o storage ativará mecanismos de autoproteção e desligará forçadamente as controladoras e os discos para evitar danos permanentes (queima dos componentes). Esse desligamento de proteção causará a parada total de todo o ambiente de TI conectado a ele. Requer acionamento imediato do suporte de hardware.
              manual_close: 'YES'
              dependencies:
                -
                  name: 'IBM Storage: Falha ao coletar dados via API'
                  expression: |
                    nodata(/TEMPLATE API STORAGE FS/Get.Canisters,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Hosts,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.lsdrive,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.LsEnclosure,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
            -
              uuid: 9079a34a58054e8ea54e960b6cff81ff
              expression: 'max(/TEMPLATE API STORAGE FS/enclosure.canisters.online["{#ENCLOSURE_ID}"],#3)<max(/TEMPLATE API STORAGE FS/enclosure.canisters.total["{#ENCLOSURE_ID}"],#3)'
              name: 'Storage: Perda de redundância de Controladora (Canister Offline no Enclosure "{#ENCLOSURE_ID}")'
              priority: HIGH
              description: |
                Significado: O nó de controle (Canister) do storage não está operando normalmente (podendo estar offline, em estado de serviço ou degradado).
                Impacto: A controladora deixou de processar I/O. Como o storage trabalha com alta disponibilidade (redundância de nós), o impacto imediato é a degradação de performance, já que todo o tráfego foi redirecionado para a controladora sobrevivente. A redundância foi perdida: se o segundo Canister falhar, ocorrerá a parada total do storage e a indisponibilidade imediata de todos os servidores e bancos de dados (VMware, Oracle, etc.) conectados a ele. Requer acionamento imediato do suporte de hardware (IBM).
              manual_close: 'YES'
              dependencies:
                -
                  name: 'IBM Storage: Falha ao coletar dados via API'
                  expression: |
                    nodata(/TEMPLATE API STORAGE FS/Get.Canisters,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Hosts,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.lsdrive,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.LsEnclosure,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
            -
              uuid: d0fdf09bcf0d45279da98c4f3140e48f
              expression: 'max(/TEMPLATE API STORAGE FS/enclosure.psus.online["{#ENCLOSURE_ID}"],#3)<max(/TEMPLATE API STORAGE FS/enclosure.psus.total["{#ENCLOSURE_ID}"],#3)'
              name: 'Storage: Perda de redundância de Energia (PSU Offline no Enclosure "{#ENCLOSURE_ID}")'
              priority: HIGH
              description: |
                Significado: Uma das fontes de alimentação (PSU - Power Supply Unit) do Enclosure do storage falhou, está sem energia ou foi removida.
                Impacto: O storage perdeu a redundância de energia elétrica. Embora continue operando com a PSU sobrevivente, uma oscilação na rede do data center ou a falha da fonte restante causará o desligamento abrupto do Enclosure. Isso resulta em parada total do equipamento, interrupção imediata de todo o I/O, queda dos servidores conectados e altíssimo risco de corrupção de dados em cache não gravado no disco. Requer verificação elétrica imediata (cabos/PDUs) e acionamento do suporte de hardware.
              manual_close: 'YES'
              dependencies:
                -
                  name: 'IBM Storage: Falha ao coletar dados via API'
                  expression: |
                    nodata(/TEMPLATE API STORAGE FS/Get.Canisters,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Hosts,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.lsdrive,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.LsEnclosure,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                    or
                    nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
          master_item:
            key: Get.LsEnclosure
          lld_macro_paths:
            -
              lld_macro: '{#SERIAL_NUMBER}'
              path: $.serial_number
            -
              lld_macro: '{#ENCLOSURE_ID}'
              path: $.id
        -
          uuid: f04d145c09e24f9f83c5df9251f0f418
          name: 'Storage Pools PSUs'
          type: DEPENDENT
          key: Pools.PSUs
          delay: '0'
          lifetime: 7d
          item_prototypes:
            -
              uuid: 8d3ba5a05c2d44e9b144889adceb23fd
              name: 'Alimentação da PSU: "{#PSU_ID}" (Enclosure: "{#ENCLOSURE_ID}")'
              type: DEPENDENT
              key: 'psu.input_power["{#ENCLOSURE_ID}:{#PSU_ID}"]'
              delay: '0'
              history: 31d
              trends: '0'
              value_type: CHAR
              preprocessing:
                -
                  type: JSONPATH
                  parameters:
                    - '$..[?(@.enclosure_id == "{#ENCLOSURE_ID}" && @.PSU_id == "{#PSU_ID}")].input_power.first()'
                -
                  type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 24h
              master_item:
                key: Get.PSUs
            -
              uuid: fc8a492e710449458e249d9d47938748
              name: 'Status da PSU: "{#PSU_ID}" (Enclosure: "{#ENCLOSURE_ID}")'
              type: DEPENDENT
              key: 'psu.status["{#ENCLOSURE_ID}:{#PSU_ID}"]'
              delay: '0'
              history: 31d
              valuemap:
                name: Status
              preprocessing:
                -
                  type: JSONPATH
                  parameters:
                    - '$..[?(@.enclosure_id == "{#ENCLOSURE_ID}" && @.PSU_id == "{#PSU_ID}")].status.first()'
                -
                  type: REGEX
                  parameters:
                    - online
                    - '1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: Get.PSUs
              trigger_prototypes:
                -
                  uuid: 14f10d83478947d780689a53a0534c5c
                  expression: 'max(/TEMPLATE API STORAGE FS/psu.status["{#ENCLOSURE_ID}:{#PSU_ID}"],#3)=0'
                  name: 'Storage: Falha de hardware na PSU "{#PSU_ID}" (Enclosure: "{#ENCLOSURE_ID}")'
                  priority: HIGH
                  description: |
                    Significado: A fonte de alimentação (PSU) não está registrando entrada de energia elétrica (Input Power zerado), indicando que parou de receber alimentação da tomada/PDU.
                    Impacto: A PSU está inoperante por falta de alimentação elétrica externa, eliminando a redundância de energia do Enclosure. Isso geralmente indica um cabo de força desconectado, o desarme de um disjuntor na PDU do rack, ou a queda de uma das pernas (fases) do No-Break (UPS) do data center. Sem essa redundância, uma falha na rede elétrica secundária causará o desligamento imediato do storage, resultando em indisponibilidade total de todos os servidores e bancos de dados que dependem dele. Requer verificação imediata da infraestrutura elétrica do rack e dos cabos de força traseiros.
                  manual_close: 'YES'
                  dependencies:
                    -
                      name: 'IBM Storage: Falha ao coletar dados via API'
                      expression: |
                        nodata(/TEMPLATE API STORAGE FS/Get.Canisters,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Hosts,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.lsdrive,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.LsEnclosure,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
          master_item:
            key: Get.PSUs
          lld_macro_paths:
            -
              lld_macro: '{#ENCLOSURE_ID}'
              path: $.enclosure_id
            -
              lld_macro: '{#PSU_ID}'
              path: $.PSU_id
        -
          uuid: 43ac3306c754450b982a254715c800cc
          name: 'Storage Volumes (VDisks)'
          type: DEPENDENT
          key: Pools.Volumes.vdisks
          delay: '0'
          lifetime: 7d
          item_prototypes:
            -
              uuid: 62f49b708e574249bf0ac0afd6ee58fa
              name: 'Capacidade - Volume: "{#VDISK_NAME}"'
              type: DEPENDENT
              key: 'vdisk.capacity.raw["{#VDISK_ID}"]'
              delay: '0'
