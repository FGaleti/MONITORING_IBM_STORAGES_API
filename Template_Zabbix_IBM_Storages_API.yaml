          name: 'Storage: Get Canisters'
          type: SCRIPT
          key: Get.Canisters
          delay: 15m
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            // --- LEITURA DE PARÂMETROS NATIVA DO ZABBIX ---
            var params = {};
            try {
                params = JSON.parse(value);
            } catch (e) {
                throw JSON.stringify({ error: "O Zabbix não enviou os parâmetros no formato JSON. Verifique a seção Parameters do item." });
            }
            
            var baseUrl = params.base_url;
            var username = params.username;
            var password = params.password;
            
            function fail(msg, details) {
                var out = { error: msg };
                if (details) { out.details = details; }
                throw JSON.stringify(out);
            }
            
            function normalizeBaseUrl(url) {
                return url.replace(/\/+$/, '');
            }
            
            function parseJsonSafe(raw, context) {
                if (raw === null || raw === undefined || raw === '') {
                    fail('Resposta vazia da API em ' + context);
                }
                try {
                    return JSON.parse(raw);
                } catch (e) {
                    fail('Resposta não é JSON válido em ' + context, String(e));
                }
            }
            
            function getStatusCode(req, fallbackBody) {
                var status = null;
                try { status = req.getStatus(); } catch (e) {}
            
                if (status !== null && status !== undefined) {
                    return parseInt(status, 10);
                }
            
                if (fallbackBody && typeof fallbackBody === 'string') {
                    var m = fallbackBody.match(/^HTTP\/\d\.\d\s+(\d{3})/m);
                    if (m) { return parseInt(m[1], 10); }
                }
                return null;
            }
            
            function getHeaderValueCaseInsensitive(headers, name) {
                if (!headers) { return null; }
                var lowerName = String(name).toLowerCase();
                for (var key in headers) {
                    if (headers.hasOwnProperty(key) && String(key).toLowerCase() === lowerName) {
                        return headers[key];
                    }
                }
                return null;
            }
            
            function extractToken(req, authBody) {
                var headers = null;
                var token = null;
            
                try { headers = req.getHeaders(); } catch (e) { headers = null; }
            
                token = getHeaderValueCaseInsensitive(headers, 'X-Auth-Token');
            
                if (!token && typeof authBody === 'string' && authBody.length > 0) {
                    var parsed = null;
                    try { parsed = JSON.parse(authBody); } catch (eJson) { parsed = null; }
            
                    if (parsed && typeof parsed === 'object') {
                        token = parsed.token || parsed.auth_token || parsed['X-Auth-Token'] || parsed.x_auth_token || null;
                    }
            
                    if (!token) {
                        var m = authBody.match(/"(?:token|auth_token|x_auth_token|X-Auth-Token)"\s*:\s*"([^"]+)"/);
                        if (m) { token = m[1]; }
                    }
                }
            
                if (!token || String(token).trim() === '') {
                    fail('Token de autenticação não encontrado (header ou corpo).', authBody);
                }
                return String(token).trim();
            }
            
            // --- VALIDAÇÃO INICIAL ---
            if (!baseUrl) { fail('Parâmetro obrigatório ausente: base_url'); }
            if (!username) { fail('Parâmetro obrigatório ausente: username'); }
            if (!password) { fail('Parâmetro obrigatório ausente: password'); }
            
            baseUrl = normalizeBaseUrl(baseUrl);
            
            var authUrl = baseUrl + '/rest/v1/auth';
            // URL alterada para buscar os canisters
            var dataUrl = baseUrl + '/rest/v1/lsenclosurecanister'; 
            
            // --- INSTÂNCIA HTTP ---
            var req = new HttpRequest();
            
            var authBody;
            var authStatus;
            var token;
            var dataBody;
            var dataStatus;
            var dataParsed;
            
            try {
                // PASSO 1: Solicitar Token
                req.clearHeader();
                req.addHeader('Content-Type: application/json');
                req.addHeader('X-Auth-Username: ' + username);
                req.addHeader('X-Auth-Password: ' + password);
            
                authBody = req.post(authUrl, '');
                authStatus = getStatusCode(req, authBody);
            
                if (authStatus !== 200 && authStatus !== 201) {
                    fail('Falha na autenticação. HTTP ' + (authStatus === null ? 'desconhecido' : authStatus), authBody);
                }
            
                token = extractToken(req, authBody);
            
                // PASSO 2: Coletar os Canisters
                req.clearHeader();
                req.addHeader('X-Auth-Token: ' + token);
                req.addHeader('Accept: application/json');
            
                dataBody = req.post(dataUrl, '');
                dataStatus = getStatusCode(req, dataBody);
            
                if (dataStatus !== 200) {
                    fail('Falha ao coletar lsenclosurecanister. HTTP ' + (dataStatus === null ? 'desconhecido' : dataStatus), dataBody);
                }
            
                dataParsed = parseJsonSafe(dataBody, '/rest/v1/lsenclosurecanister');
            
                if (!(dataParsed instanceof Array)) {
                    fail('Formato inesperado: a API não retornou um array de Canisters JSON.', dataBody);
                }
            
                return JSON.stringify(dataParsed);
            
            } catch (e) {
                if (typeof e === 'string') { throw e; }
                fail('Erro inesperado na execução do script.', String(e));
            }
          timeout: 30s
          parameters:
            -
              name: base_url
              value: '{$API.URL}'
            -
              name: password
              value: '{$API.PASS}'
            -
              name: username
              value: '{$API.USER}'
