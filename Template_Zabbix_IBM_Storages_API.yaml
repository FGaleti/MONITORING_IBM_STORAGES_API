              discover: NO_DISCOVER
              value_type: CHAR
              preprocessing:
                -
                  type: JSONPATH
                  parameters:
                    - '$..[?(@.id == "{#VDISK_ID}")].mdisk_grp_name.first()'
                -
                  type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 24h
              master_item:
                key: Get.Volumes_vdisks
            -
              uuid: dab7fb91f4474a0ea5fad61dce5e8074
              name: 'Snapshots - Volume: "{#VDISK_NAME}"'
              type: DEPENDENT
              key: 'vdisk.snapshots["{#VDISK_ID}"]'
              delay: '0'
              history: 31d
              preprocessing:
