                  type: JSONPATH
                  parameters:
                    - '$..[?(@.id == "{#VDISK_ID}")].snapshot_count.first()'
              master_item:
                key: Get.Volumes_vdisks
            -
              uuid: b281de8f4f1a433891dd4ecda2c996af
              name: 'Status do Volume: "{#VDISK_NAME}"'
              type: DEPENDENT
              key: 'vdisk.status["{#VDISK_ID}"]'
              delay: '0'
              history: 31d
              valuemap:
                name: Status
              preprocessing:
