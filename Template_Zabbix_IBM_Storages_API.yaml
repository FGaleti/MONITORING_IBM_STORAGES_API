                }
            
                // --- PASSO 3: TRATAMENTO DE CAPACIDADE (Injetando capacity_bytes) ---
                for (var i = 0; i < dataParsed.length; i++) {
                    var vdisk = dataParsed[i];
                    
                    // Garante que o campo original existe e é uma string antes de processar
