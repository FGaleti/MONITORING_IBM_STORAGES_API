        or
        nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
        or
        nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
        or
        nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
      name: 'IBM Storage: Falha ao coletar dados via API'
