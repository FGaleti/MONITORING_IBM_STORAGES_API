                -
                  type: REGEX
                  parameters:
                    - online
                    - '1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: Get.Volumes_vdisks
              trigger_prototypes:
                -
                  uuid: fd8d0bc6cf7c40cb926c61345fa61af2
                  expression: 'max(/TEMPLATE API STORAGE FS/vdisk.status["{#VDISK_ID}"],#3)=0'
                  name: 'Storage: Volume "{#VDISK_NAME}" está Offline/Inacessível'
                  priority: HIGH
                  description: |
                    Significado: O volume lógico (VDisk/LUN) mapeado para um ou mais servidores apresentou um estado anormal de operação (podendo estar offline, degradado ou bloqueado por falta de espaço no pool).
                    
                    Impacto: Este é um cenário de interrupção total de serviço para o host que utiliza este volume. O servidor perderá o acesso ao seu disco de dados ou sistema operacional, resultando em travamento imediato (BSOD/Kernel Panic), corrupção de sistemas de arquivos e parada crítica de bancos de dados. Se este volume hospedar datastores VMware, todas as máquinas virtuais contidas nele ficarão em estado 'Inaccessible' ou 'Orphaned'. Requer investigação urgente para entender se a queda foi causada por falha física no pool ou erro de configuração de mapeamento.
                  manual_close: 'YES'
                  dependencies:
                    -
                      name: 'IBM Storage: Falha ao coletar dados via API'
                      expression: |
                        nodata(/TEMPLATE API STORAGE FS/Get.Canisters,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Hosts,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.lsdrive,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.LsEnclosure,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Pools,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.PSUs,45m)=1
                        or
                        nodata(/TEMPLATE API STORAGE FS/Get.Volumes_vdisks,45m)=1
            -
