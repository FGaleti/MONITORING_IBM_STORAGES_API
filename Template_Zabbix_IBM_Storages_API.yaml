              trigger_prototypes:
                -
                  uuid: e2c6f0aab46d4bd4b5e30fbc9013b362
                  expression: 'max(/TEMPLATE API STORAGE FS/storage.pool.free_capacity["{#POOL_NAME}:{#POOL_ID}"],#3)<536870912000'
                  name: 'Storage: Pool "{#POOL_NAME}" com capacidade crítica (<500G)'
                  priority: HIGH
                  description: |
                    Significado: O pool de armazenamento esgotou quase toda a sua capacidade física real disponível para gravação de novos blocos de dados.
                    
                    Impacto: Se o pool atingir 100% de uso de sua capacidade real, o storage bloqueará novas operações de escrita. Em ambientes que utilizam Thin Provisioning, a falta de espaço real fará com que os volumes virtuais (VDisks) entrem em estado "offline por falta de espaço". O impacto imediato é o travamento abrupto de sistemas operacionais, queda de aplicações e alto risco de corrupção em bancos de dados (Oracle, SQL, etc.) que não conseguirão efetivar transações no disco. Requer expansão emergencial do pool (adição de novos MDisks) ou exclusão urgente de volumes obsoletos para liberar espaço.
